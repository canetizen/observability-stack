auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9097

common:
  path_prefix: /data/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /data/loki/chunks

compactor:
  working_directory: /data/loki/compactor
  delete_request_store: filesystem

limits_config:
  allow_structured_metadata: true
  # Every top-level JSON field of a file log record becomes structured metadata,
  # so the defaults (128 entries, 64KB) reject wide application records.
  max_structured_metadata_entries_count: 1024
  max_structured_metadata_size: 256KB
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - observability.stack_scope

analytics:
  reporting_enabled: false