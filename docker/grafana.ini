[server]
http_addr = 0.0.0.0
http_port = 3000

[security]
admin_user = admin
admin_password = admin
disable_initial_admin_creation = false

[users]
allow_sign_up = false

[analytics]
reporting_enabled = false
check_for_updates = false

[paths]
data = /data/grafana
logs = /data/grafana/logs
plugins = /data/grafana/plugins
provisioning = /etc/observability/grafana/provisioning