receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
  batch:
    timeout: 5s
    send_batch_size: 512
  transform/stack_scope:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - set(attributes["observability.stack_scope"], "lgtm")

exporters:
  otlp/tempo:
    endpoint: 127.0.0.1:4319
    tls:
      insecure: true
  otlp/jaeger:
    endpoint: 127.0.0.1:14317
    tls:
      insecure: true
  prometheusremotewrite/mimir:
    endpoint: http://127.0.0.1:9009/api/v1/push
  otlphttp/loki:
    endpoint: http://127.0.0.1:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite/mimir]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/stack_scope, batch]
      exporters: [otlphttp/loki]